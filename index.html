<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ademir Cardoso Costa — Gerente de Negócios PJ | Sicredi</title>
<meta name="description" content="Cartão de visita digital de Ademir Cardoso Costa — Gerente de Negócios PJ, Sicredi União MS/TO e Oeste da Bahia." />
<meta name="theme-color" content="#3FA110" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233FA110'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3EAC%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   CARTÃO DE VISITA DIGITAL — Sicredi
   Cores oficiais: Verde Sicredi #3FA110 · Verde escuro #146E37
   Para personalizar, edite o objeto CONFIG no final do arquivo.
   ============================================================ */
:root{
  --green:    #3FA110;
  --green-d:  #146E37;
  --green-l:  #D7E6C8;
  --green-50: #F4F9F0;
  --ink:      #1C2A20;
  --muted:    #5A645A;
  --line:     #E4EADF;
  --radius:   26px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body{ min-height:100%; }

body{
  margin:0;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color:var(--ink);
  background:#F1F5ED;
  -webkit-font-smoothing:antialiased;
}

.bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(900px 620px at 50% -12%, rgba(63,161,16,.14), transparent 62%),
    radial-gradient(760px 520px at 88% 112%, rgba(20,110,55,.11), transparent 62%),
    #F1F5ED;
}

/* ---------- palco ---------- */
.stage{
  position:relative;
  z-index:1;
  width:100%;
  max-width:430px;
  perspective:1700px;
}

.card{
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:
    0 26px 60px rgba(20,110,55,.14),
    0 2px 4px rgba(20,110,55,.05);
  overflow:hidden;
}

/* faixa verde da lateral (como no cartão impresso) */
.stripe{
  position:absolute;
  left:0; top:0; bottom:0;
  width:7px;
  z-index:6;
  background:linear-gradient(180deg, var(--green) 0%, #339113 52%, var(--green-d) 100%);
}

/* ---------- barra do topo ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 15px 12px 21px;
  border-bottom:1px solid #EFF4EA;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.22em;
  color:var(--green);
}
.brand span{
  font-size:7.5px;
  font-weight:600;
  letter-spacing:.16em;
  color:var(--muted);
}
.topbar-actions{ display:flex; gap:6px; }

.icon-btn{
  width:34px; height:34px;
  display:grid; place-items:center;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--green-d);
  cursor:pointer;
  transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.icon-btn:hover,
.icon-btn:focus-visible{
  background:var(--green-50);
  border-color:#C9DDBB;
  box-shadow:0 3px 10px rgba(20,110,55,.10);
  outline:none;
}
.icon-btn svg{ width:14px; height:14px; }

/* ---------- corpo ---------- */
.body{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:22px 21px 20px 27px;
}

.avatar-wrap{
  position:relative;
  width:108px; height:108px;
  display:block;
}
.avatar{
  width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 0 0 3px var(--green-l), 0 10px 22px rgba(20,110,55,.18);
  background:#EEF3E9;
}
.li-chip{
  position:absolute;
  right:-3px; bottom:-3px;
  width:27px; height:27px;
  display:grid; place-items:center;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  border:2.5px solid #fff;
  box-shadow:0 4px 10px rgba(20,110,55,.28);
}
.li-chip svg{ width:13px; height:13px; }

.name{
  margin:16px 0 0;
  font-size:24px;
  font-weight:800;
  letter-spacing:-.01em;
  line-height:1.2;
  text-align:center;
}
.role{
  margin:6px 0 0;
  font-size:14.5px;
  font-weight:600;
  color:var(--green-d);
  text-align:center;
}
.unit{
  margin:7px 0 0;
  font-size:9.6px;
  line-height:1.45;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:center;
}
.unit .u1{ display:block; }
.unit .u2{
  display:block;
  margin-top:2px;
  font-weight:600;
  color:var(--green);
  letter-spacing:.12em;
}

/* ---------- contatos ---------- */
.contacts{
  width:100%;
  margin-top:19px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.row{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--green-50);
  text-decoration:none;
  color:inherit;
  transition:background .2s ease, border-color .2s ease;
}
.row:hover,
.row:focus-visible{
  background:#EFF7E8;
  border-color:#C9DDBB;
  outline:none;
}
.row-ico{
  flex:0 0 auto;
  width:32px; height:32px;
  display:grid; place-items:center;
  border-radius:10px;
  background:#E4F1D8;
  color:var(--green-d);
}
.row-ico svg{ width:14px; height:14px; }
.row-txt{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.row-lbl{
  font-size:8px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}
.row-val{
  font-size:13.2px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row-val.sm{ font-size:11.2px; letter-spacing:-.01em; }
.duo{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.duo .row{ padding:9px 10px; gap:7px; }
.duo .row-ico{ width:26px; height:26px; }
.duo .row-ico svg{ width:13px; height:13px; }
.duo .row-val{ font-size:11.2px; letter-spacing:-.02em; }

.addr{
  width:100%;
  margin:14px 0 0;
  display:flex;
  gap:8px;
  align-items:flex-start;
  font-size:10.4px;
  line-height:1.5;
  color:var(--muted);
}
.addr svg{
  flex:0 0 auto;
  width:12px; height:12px;
  margin-top:2px;
  color:var(--green);
}
.addr b{ color:#41503F; font-weight:600; }

/* ---------- certificações ---------- */
.certs{ width:100%; margin-top:15px; }
.certs-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  font-size:7.6px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.certs-head .ln{ flex:1; height:1px; background:var(--line); }
.certs-head .count{
  min-width:20px;
  padding:1px 5px;
  border-radius:20px;
  background:var(--green-50);
  border:1px solid var(--line);
  font-size:7px;
  text-align:center;
  color:var(--green-d);
}
.certs-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(56px, 1fr));
  gap:6px;
}
.cert{
  min-width:0;
  aspect-ratio:1 / 1;
  display:grid;
  place-items:center;
  padding:4px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  cursor:pointer;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
.cert:hover,
.cert:focus-visible{
  border-color:#BFD8AC;
  box-shadow:0 4px 12px rgba(20,110,55,.14);
  transform:translateY(-1px);
  outline:none;
}
.cert img{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
}

/* ---------- rodapé ---------- */
.foot{
  width:100%;
  margin-top:13px;
  display:flex;
  align-items:center;
  gap:7px;
}
.socials{ display:flex; gap:6px; }
.soc{
  width:41px; height:41px;
  display:grid; place-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--green-d);
  text-decoration:none;
  transition:background .2s ease, border-color .2s ease;
}
.soc:hover,
.soc:focus-visible{
  background:var(--green-50);
  border-color:#C9DDBB;
  outline:none;
}
.soc svg{ width:15px; height:15px; }

.btn-save{
  flex:1;
  height:41px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 6px 16px rgba(63,161,16,.30);
  transition:background .2s ease, box-shadow .2s ease;
}
.btn-save:hover{ background:#37900E; box-shadow:0 8px 20px rgba(63,161,16,.38); }
.btn-save svg{ width:13px; height:13px; }

/* ---------- verso (QR) ---------- */
.face{
  transition:transform .62s cubic-bezier(.45,0,.2,1), opacity .38s ease;
  transform-origin:50% 50%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.face-front{ transform:rotateY(0deg); }
.card.flipped .face-front{ transform:rotateY(-92deg); opacity:0; pointer-events:none; }

.face-back{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  transform:rotateY(92deg);
  opacity:0;
  pointer-events:none;
  z-index:1;
}
.card.flipped .face-back{
  transform:rotateY(0deg);
  opacity:1;
  pointer-events:auto;
  z-index:4;
}

.qr-body{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
  gap:12px;
  padding:18px 20px 18px 26px;
  text-align:center;
}
.qr-id{ display:flex; flex-direction:column; gap:3px; align-items:center; }
.qr-eyebrow{
  margin:0;
  font-size:7.6px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--muted);
}
.qr-name{
  margin:2px 0 0;
  font-size:15px;
  font-weight:800;
  letter-spacing:-.01em;
}
.qr-role{
  margin:0;
  font-size:8.4px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--green-d);
  font-weight:600;
}
.qr-unit{
  margin:3px 0 0;
  font-size:7.8px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
}
.qr-main{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.qr-frame{
  display:block;
  padding:9px;
  border-radius:16px;
  background:#fff;
  border:2px solid var(--green);
  line-height:0;
  box-shadow:0 12px 30px rgba(20,110,55,.18);
  transition:box-shadow .25s ease;
}
.qr-frame:hover,
.qr-frame:focus-visible{
  box-shadow:0 16px 38px rgba(20,110,55,.28);
  outline:none;
}
.qr-img{
  display:block;
  width:clamp(168px, 57vw, 244px);
  height:auto;
  border-radius:8px;
}
.qr-foot{ display:flex; flex-direction:column; gap:3px; align-items:center; }
.qr-title{
  margin:0;
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--green-d);
  font-weight:700;
}
.qr-url{
  margin:0;
  font-size:8.6px;
  color:var(--muted);
  word-break:break-all;
}
.btn-back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:33px;
  padding:0 16px;
  border:1px solid var(--green);
  border-radius:10px;
  background:#fff;
  color:var(--green-d);
  font-family:inherit;
  font-size:9.2px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .2s ease;
}
.btn-back:hover{ background:var(--green-50); }
.btn-back svg{ width:13px; height:13px; }

/* ---------- painel da certificação ---------- */
.modal{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(12,26,16,.72);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.modal.show{ opacity:1; pointer-events:auto; }

.modal-card{
  position:relative;
  width:100%;
  max-width:370px;
  max-height:86vh;
  overflow-y:auto;
  padding:20px 20px 18px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 30px 70px rgba(8,30,16,.45);
  transform:translateY(10px) scale(.98);
  transition:transform .28s cubic-bezier(.34,1.3,.5,1);
}
.modal.show .modal-card{ transform:none; }

.modal-x{
  position:absolute;
  top:12px; right:12px;
  width:28px; height:28px;
  display:grid; place-items:center;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--muted);
  font-size:16px;
  line-height:1;
  cursor:pointer;
  transition:background .2s ease, color .2s ease;
}
.modal-x:hover{ background:var(--green-50); color:var(--green-d); }

.modal-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding-right:34px;
  margin-bottom:14px;
}
.modal-head img{
  width:58px; height:58px;
  object-fit:contain;
  padding:4px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  flex:0 0 auto;
}
.modal-head h3{
  margin:0;
  font-size:15px;
  font-weight:800;
  letter-spacing:-.01em;
}
.modal-head p{
  margin:2px 0 0;
  font-size:8.4px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--green-d);
  font-weight:600;
}

.sec{ margin-bottom:13px; }
.sec:last-of-type{ margin-bottom:8px; }
.sec-lbl{
  display:block;
  margin-bottom:4px;
  font-size:7.4px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}
.sec-lbl.green{ color:var(--green); }
.sec p{
  margin:0;
  font-size:11.4px;
  line-height:1.55;
  color:#3C4A3E;
}
.modal-fonte{
  margin:0;
  padding-top:10px;
  border-top:1px solid var(--line);
  font-size:7.6px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#9AA79B;
}

/* ---------- dica de tela cheia ---------- */
.dica-fs{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translate(-50%, 16px);
  z-index:19;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 13px;
  border:1px solid rgba(63,161,16,.5);
  border-radius:999px;
  background:rgba(255,255,255,.96);
  color:var(--green-d);
  font-family:inherit;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  box-shadow:0 10px 26px rgba(20,110,55,.18);
  transition:opacity .35s ease, transform .35s cubic-bezier(.4,0,.2,1);
}
.dica-fs.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
.dica-fs svg{ width:13px; height:13px; }

/* ---------- toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:64px;
  transform:translate(-50%, 10px);
  z-index:70;
  padding:9px 16px;
  border-radius:10px;
  background:rgba(20,110,55,.96);
  color:#fff;
  font-size:10.5px;
  letter-spacing:.03em;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  box-shadow:0 10px 26px rgba(20,110,55,.3);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

/* ---------- telas pequenas ---------- */
@media (max-width:420px) and (max-height:800px){
  .body{ padding:13px 13px 12px 19px; }
  .avatar-wrap{ width:74px; height:74px; }
  .name{ font-size:17px; margin-top:9px; }
  .role{ font-size:11px; }
  .unit{ font-size:7.8px; margin-top:4px; }
  .contacts{ margin-top:10px; gap:5px; }
  .row{ padding:6.5px 9px; }
  .row-val{ font-size:10.8px; }
  .addr{ margin-top:8px; font-size:8.6px; }
  .certs{ margin-top:9px; }
  .foot{ margin-top:9px; }
  .qr-img{ width:clamp(128px, 44vw, 170px); }
}

@media (max-width:345px){
  .body{ padding-left:22px; padding-right:14px; }
  .duo .row{ padding:8px 8px; gap:6px; }
  .duo .row-ico{ width:23px; height:23px; }
  .duo .row-val{ font-size:9.8px; letter-spacing:-.03em; }
  .row-val.sm{ font-size:9.8px; }
  .name{ font-size:20px; }
}

@media (max-height:700px){
  .avatar-wrap{ width:78px; height:78px; }
  .name{ font-size:18px; margin-top:9px; }
  .certs-grid{ gap:5px; }
  .row{ padding:7px 10px; }
  .addr{ font-size:8.8px; }
}
/* no celular o botão de tela cheia do topo já resolve: some a pílula flutuante */
@media (max-width:520px){
  .dica-fs{ display:none !important; }
}
/* telas muito baixas (paisagem de celular): compacta de verdade */
@media (max-height:560px){
  .avatar-wrap{ width:60px; height:60px; }
  .name{ font-size:15px; margin-top:6px; }
  .role{ font-size:11px; }
  .unit{ display:none; }
  .row-lbl{ display:none; }
  .addr{ font-size:8px; }
  .certs{ margin-top:7px; }
}
</style>
</head>
<body>

<div class="bg"></div>

<main class="stage">
  <section class="card" id="card" aria-label="Cartão de visita digital — Ademir Cardoso Costa">

    <span class="stripe" aria-hidden="true"></span>

    <!-- ============ FRENTE ============ -->
    <div class="face face-front">

      <div class="topbar">
        <div class="brand">SICREDI <span>EMPRESAS</span></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="flipBtn" type="button" title="Verso com QR Code" aria-label="Ver verso com QR Code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h2.6v2.6H14zM20.4 14v.01M20.4 17.6v.01M14 20.4h2.6M20.4 20.4v.01"/></svg>
          </button>
          <button class="icon-btn" id="fsBtn" type="button" title="Tela cheia" aria-label="Tela cheia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </div>

      <div class="body">

        <a class="avatar-link" id="avatarLink" href="#" target="_blank" rel="noopener noreferrer"
           title="Abrir perfil no LinkedIn" aria-label="Abrir perfil no LinkedIn">
          <span class="avatar-wrap">

    '<span class="row-val' + (item.compacto ? ' sm' : '') + '">' + item.valor + '</span></span>';
  return a;
}

const modal = $("#modal");
const modalBody = $("#modalBody");

function abrirDetalhe(cert){
  const d = DETALHES[cert.nome] || null;

  $("#modalImg").src = cert.img;
  $("#modalImg").alt = cert.nome;
  $("#modalNome").textContent = cert.nome;

  } else {
    modalBody.innerHTML =
      '<div class="sec"><span class="sec-lbl">O que é</span><p>' + d.oque + '</p></div>' +
      '<div class="sec"><span class="sec-lbl green">Para você, cliente</span><p>' + d.cliente + '</p></div>' +
      '<div class="sec"><span class="sec-lbl">Para o profissional</span><p>' + d.profissional + '</p></div>';
  }

  modal.classList.add("show");
  modal.querySelector(".modal-card").scrollTop = 0;
}

function fecharDetalhe(){ modal.classList.remove("show"); }

$("#modalX").addEventListener("click", fecharDetalhe);
modal.addEventListener("click", (e) => { if (e.target === modal) fecharDetalhe(); });

/* ============================================================

   ============================================================ */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

const card = $("#card");
const faceBack = $("#faceBack");

function virarCartao(alvo){
  const virar = typeof alvo === "boolean" ? alvo : !card.classList.contains("flipped");
  card.classList.toggle("flipped", virar);
  faceBack.setAttribute("aria-hidden", virar ? "false" : "true");
}
$("#flipBtn").addEventListener("click", (e) => { e.stopPropagation(); virarCartao(true); });
$("#flipBackBtn").addEventListener("click", (e) => { e.stopPropagation(); virarCartao(false); });

function montarVCard(){
  const linhas = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Costa;Ademir;Cardoso;;",
    "FN:" + CONFIG.nome,
    "ORG:" + CONFIG.unidade + ";" + CONFIG.plataforma,
    "TITLE:" + CONFIG.cargo,
    "TEL;TYPE=WORK,VOICE:" + CONFIG.telLink,

    "ADR;TYPE=WORK:;;" + CONFIG.endereco.replace(" — ", " - ") + ";" + "Campo Grande;MS;79002-075;Brasil",
    "END:VCARD"
  ];

}
$("#vcardBtn").addEventListener("click", () => {
  const blob = new Blob([montarVCard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Ademir-Cardoso-Costa-Sicredi.vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast("contato salvo em .vcf");
});

/* ============================================================
   8) Tela cheia
   ============================================================ */
const dicaFs = $("#dicaFs");
const temFullscreen = !!(
  document.documentElement.requestFullscreen ||
  document.documentElement.webkitRequestFullscreen
);
let fsAtivo = false;
let fsManual = false;

function pedirTelaCheia(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req || document.fullscreenElement) return Promise.resolve(!!document.fullscreenElement);
  try {
    const r = req.call(el);
    if (r && typeof r.then === "function") return r.then(() => true).catch(() => false);
    return Promise.resolve(true);
  } catch (err) {
    return Promise.resolve(false);
  }
}
function esconderDica(){ dicaFs.classList.remove("show"); }
let dicaTimer;
function mostrarDica(){
  if (!temFullscreen || document.fullscreenElement || fsManual) return;
  dicaFs.classList.add("show");
  clearTimeout(dicaTimer);
  dicaTimer = setTimeout(esconderDica, 8000);
}

function tentativaInicial(){
  if (fsManual || document.fullscreenElement) return;
  pedirTelaCheia().then((ok) => { if (!ok) setTimeout(mostrarDica, 500); });
}
tentativaInicial();
window.addEventListener("load", () => {
  tentativaInicial();
  setTimeout(() => { if (!document.fullscreenElement && !fsManual) pedirTelaCheia(); }, 350);
});
document.addEventListener("pageshow", (e) => { if (e.persisted) tentativaInicial(); });

let tentativas = 0;
function tentarTelaCheiaAuto(){
  if (document.fullscreenElement || fsManual || tentativas >= 8) return;
  tentativas++;
  pedirTelaCheia().then((ok) => { if (ok) esconderDica(); });
}
["pointerdown", "mousedown", "touchstart", "touchend", "click", "keydown", "wheel", "touchmove"]
  .forEach((ev) => document.addEventListener(ev, tentarTelaCheiaAuto, { passive: true }));

document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    fsAtivo = true;
    tentativas = 0;
    esconderDica();
  } else if (fsAtivo) {
    fsAtivo = false;
    fsManual = true;
  }
});

dicaFs.addEventListener("click", async (e) => {
  e.stopPropagation();
  const ok = await pedirTelaCheia();
  if (ok) esconderDica();
  else toast("use 'adicionar à tela inicial'");
});

$("#fsBtn").addEventListener("click", async (e) => {
  e.stopPropagation();
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      fsManual = false;
      toast("tela cheia ativada");
    } else {
      await document.exitFullscreen();
      fsManual = true;
      toast("tela cheia desativada");
    }
  } catch (err) {
    toast("use 'adicionar à tela inicial'");
  }
});
</script>
<script>
/* ---------- auto-ajuste: o cartão nunca passa da tela ---------- */
(function(){
  var stage = document.querySelector(".stage");
  var card  = document.getElementById("card");
  if (!stage || !card) return;
  function ajustar(){
    stage.style.zoom = "";
    var bs = getComputedStyle(document.body);
    var padY = (parseFloat(bs.paddingTop) || 0) + (parseFloat(bs.paddingBottom) || 0);
    var padX = (parseFloat(bs.paddingLeft) || 0) + (parseFloat(bs.paddingRight) || 0);
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var vw = window.visualViewport ? window.visualViewport.width  : window.innerWidth;
    var availH = vh - padY - 10;
    var availW = vw - padX - 4;
    var r = card.getBoundingClientRect();
    if (!r.height || !r.width) return;
    var s = Math.min(1, availH / r.height, availW / r.width);
    s = Math.max(s, 0.6);
    s = Math.floor(s * 1000) / 1000;
    if (s < 0.999) stage.style.zoom = String(s);
  }
  function agenda(){ requestAnimationFrame(ajustar); }
  window.addEventListener("load", agenda);
  window.addEventListener("resize", agenda);
  window.addEventListener("orientationchange", function(){ setTimeout(agenda, 260); });
  document.addEventListener("fullscreenchange", function(){ setTimeout(agenda, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", agenda);
  setTimeout(agenda, 60);
  setTimeout(agenda, 400);
})();
</script>
